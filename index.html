<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근태 인원 체크</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 20px;
    color: #1a1a2e;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .card-header h2 { font-size: 1.1rem; color: #333; }
  textarea {
    width: 100%;
    height: 200px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.9rem;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.2s;
  }
  textarea:focus { outline: none; border-color: #4a6cf7; }
  .row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 12px;
  }
  button {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    background: #4a6cf7;
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { background: #3a5ce5; }
  .btn-secondary {
    background: #e8ecf1;
    color: #333;
  }
  .btn-secondary:hover { background: #dce1e8; }
  .btn-small {
    padding: 5px 12px;
    font-size: 0.8rem;
  }

  /* Results */
  .result-group {
    margin-bottom: 14px;
  }
  .result-group:last-child { margin-bottom: 0; }
  .result-label {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-label .count {
    background: #4a6cf7;
    color: #fff;
    border-radius: 12px;
    padding: 1px 8px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .result-label.special .count { background: #f59e0b; }
  .result-label.weekend .count { background: #ef4444; }
  .result-names {
    color: #555;
    font-size: 0.95rem;
    line-height: 1.6;
    padding-left: 4px;
  }
  #results { display: none; }
  #results.show { display: block; }
  .result-date {
    text-align: center;
    font-size: 1rem;
    color: #666;
    margin-bottom: 14px;
    font-weight: 500;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 { margin-bottom: 8px; font-size: 1.1rem; }
  .modal p { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
  .modal textarea { height: 300px; }
  .modal .row { justify-content: flex-end; }

  /* Guide */
  .guide {
    display: none;
    background: #f8f9fb;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .guide.show { display: block; }
  .guide-step {
    font-size: 0.9rem;
    color: #333;
    padding: 4px 0;
  }
  .guide-note {
    font-size: 0.8rem;
    color: #888;
    padding: 2px 0;
    margin-top: 4px;
  }

  .no-result {
    text-align: center;
    color: #999;
    padding: 20px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="container">
  <h1>근태 인원 체크</h1>

  <div class="card">
    <div class="card-header">
      <h2>채팅 내용</h2>
      <div>
        <button class="btn-secondary btn-small" onclick="toggleGuide()">사용방법</button>
        <button class="btn-secondary btn-small" onclick="openModal()">팀원 관리</button>
      </div>
    </div>
    <div class="guide" id="guide">
      <div class="guide-step"><b>1.</b> 두레이 채팅방에서 근태 메시지가 있는 구간을 <b>드래그하여 복사</b> (Ctrl+C)</div>
      <div class="guide-step"><b>2.</b> 아래 입력창에 <b>붙여넣기</b> (Ctrl+V)</div>
      <div class="guide-step"><b>3.</b> <b>분석하기</b> 버튼 클릭</div>
      <div class="guide-note">* 복사할 때 상단에 날짜 구분선(예: 2026.03.25 수요일)이 포함되어야 합니다.</div>
      <div class="guide-note">* 다음날 오전 10시 전에 보낸 메시지도 자동으로 포함됩니다.</div>
    </div>
    <textarea id="chatInput" placeholder="두레이 채팅방에서 복사한 내용을 여기에 붙여넣으세요..."></textarea>
    <div class="row">
      <button class="btn-primary" onclick="analyze()">분석하기</button>
    </div>
  </div>

  <div class="card" id="results">
    <div class="card-header">
      <h2>조회 결과</h2>
      <button class="btn-secondary btn-small" onclick="copyResult()">복사</button>
    </div>
    <div class="result-date" id="resultDate"></div>
    <div id="resultContent"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>팀원 관리</h2>
    <p>한 줄에 한 명씩 이름을 입력하세요. 변경 시 자동 저장됩니다.</p>
    <textarea id="memberInput"></textarea>
    <div class="row">
      <button class="btn-secondary" onclick="resetMembers()">기본값 복원</button>
      <button class="btn-primary" onclick="saveMembers()">저장</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_MEMBERS = [
  '백종민','현범호','조형진','최인석','김충현','송대호','김동한','홍가희',
  '윤현수','배재경','장대원','장재영','이준모','김혜지','김재현','김윤수',
  '임동희','김민희','민종호','옥동현','박우승','양세나','전성아','최서윤',
  '염승현','손혜진','이수빈','신연화','강윤영'
];

function getMembers() {
  const saved = localStorage.getItem('checkin_members');
  if (saved) {
    try { return JSON.parse(saved); } catch(e) {}
  }
  return [...DEFAULT_MEMBERS];
}

function openModal() {
  document.getElementById('memberInput').value = getMembers().join('\n');
  document.getElementById('modal').classList.add('show');
}

function saveMembers() {
  const text = document.getElementById('memberInput').value;
  const members = text.split('\n').map(s => s.trim()).filter(Boolean);
  localStorage.setItem('checkin_members', JSON.stringify(members));
  document.getElementById('modal').classList.remove('show');
}

function resetMembers() {
  localStorage.removeItem('checkin_members');
  document.getElementById('memberInput').value = DEFAULT_MEMBERS.join('\n');
}

function toggleGuide() {
  document.getElementById('guide').classList.toggle('show');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});

// ===== Parsing Logic =====

function nextBusinessDay(date) {
  const d = new Date(date);
  d.setDate(d.getDate() + 1);
  // Skip Saturday(6) and Sunday(0)
  while (d.getDay() === 0 || d.getDay() === 6) {
    d.setDate(d.getDate() + 1);
  }
  return d;
}

function detectDateFromChat(text) {
  const dateSepRegex = /(\d{4})\.(\d{2})\.(\d{2})\s/g;
  let firstDate = null;

  let match;
  while ((match = dateSepRegex.exec(text)) !== null) {
    const d = new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
    if (!firstDate || d < firstDate) {
      firstDate = d;
    }
  }

  if (firstDate) {
    return nextBusinessDay(firstDate);
  }
  return null;
}

function analyze() {
  const text = document.getElementById('chatInput').value.trim();
  if (!text) return;

  const targetDate = detectDateFromChat(text);
  if (!targetDate) {
    document.getElementById('resultContent').innerHTML =
      '<div class="no-result">날짜 구분선(예: 2026.03.25 수요일)을 찾을 수 없습니다.</div>';
    document.getElementById('results').classList.add('show');
    return;
  }
  const targetMonth = targetDate.getMonth() + 1;
  const targetDay = targetDate.getDate();
  const dayOfWeek = targetDate.getDay(); // 0=Sun, 5=Fri

  const isFriday = dayOfWeek === 5;
  const defaultHour = isFriday ? 8 : 10;

  const members = getMembers();
  const result = {}; // name -> { hour: number | null, note: string | null }
  const weekendWork = {}; // dateKey -> { name -> { hour, note } }

  // Parse chat into sender blocks
  const blocks = parseSenderBlocks(text);

  // Collect weekend dates to check (Sat/Sun before target Monday)
  const weekendDates = [];
  if (dayOfWeek === 1) { // Monday
    const sat = new Date(targetDate);
    sat.setDate(sat.getDate() - 2);
    const sun = new Date(targetDate);
    sun.setDate(sun.getDate() - 1);
    weekendDates.push(sat, sun);
  }

  for (const block of blocks) {
    const name = block.name;

    // Parse for target date
    const info = parseCheckinInfo(block.lines, targetMonth, targetDay, targetDate, block.chatDate);
    if (info) {
      if (result[name]) {
        if (info.note) result[name].note = info.note;
        if (info.hour !== null) result[name].hour = info.hour;
      } else {
        result[name] = info;
      }
    }

    // Parse for weekend work (only if target is Monday)
    for (const wd of weekendDates) {
      const wm = wd.getMonth() + 1;
      const wday = wd.getDate();
      const wInfo = parseCheckinInfo(block.lines, wm, wday, wd, block.chatDate, true);
      if (wInfo) {
        const key = `${wm}/${wday}`;
        if (!weekendWork[key]) weekendWork[key] = { date: wd, entries: {} };
        weekendWork[key].entries[name] = wInfo;
      }
    }
  }

  // Build output
  const hourGroups = {}; // hour -> [names]
  const specialList = []; // [{name, note}]
  const allProcessed = new Set(Object.keys(result));

  for (const [name, info] of Object.entries(result)) {
    if (!members.includes(name)) continue;
    if (info.hour !== null && info.note) {
      // Both hour and note (e.g. "8출 오후반차")
      const h = info.hour;
      if (!hourGroups[h]) hourGroups[h] = [];
      hourGroups[h].push(name);
      specialList.push({ name, note: info.note });
    } else if (info.note) {
      specialList.push({ name, note: info.note });
    } else if (info.hour !== null) {
      const h = info.hour;
      if (!hourGroups[h]) hourGroups[h] = [];
      hourGroups[h].push(name);
    }
  }

  // Unmentioned members get default hour
  for (const name of members) {
    if (!allProcessed.has(name)) {
      if (!hourGroups[defaultHour]) hourGroups[defaultHour] = [];
      hourGroups[defaultHour].push(name);
    }
  }

  // Render results
  renderResults(hourGroups, specialList, targetDate, isFriday, defaultHour, weekendWork);
}

function parseSenderBlocks(text) {
  const lines = text.split('\n');
  const blocks = [];
  const senderRegex = /^[A-Za-z\s\(\)]+\(([\uac00-\ud7a3]+)\)/;
  // Date separator: "2026.03.27 금요일"
  const dateSepRegex = /^(\d{4})\.(\d{2})\.(\d{2})\s/;

  let currentName = null;
  let currentLines = [];
  let currentChatDate = null; // date from separator line

  for (const line of lines) {
    // Check for date separator line
    const dateSepMatch = line.match(dateSepRegex);
    if (dateSepMatch) {
      if (currentName) {
        blocks.push({ name: currentName, lines: currentLines, chatDate: currentChatDate });
      }
      currentName = null;
      currentLines = [];
      currentChatDate = new Date(
        parseInt(dateSepMatch[1]),
        parseInt(dateSepMatch[2]) - 1,
        parseInt(dateSepMatch[3])
      );
      continue;
    }

    const match = line.match(senderRegex);
    if (match) {
      if (currentName) {
        blocks.push({ name: currentName, lines: currentLines, chatDate: currentChatDate });
      }
      currentName = match[1];
      currentLines = [];
    } else if (currentName) {
      currentLines.push(line);
    }
  }
  if (currentName) {
    blocks.push({ name: currentName, lines: currentLines, chatDate: currentChatDate });
  }

  return blocks;
}

function parseCheckinInfo(lines, targetMonth, targetDay, targetDate, chatDate, weekendOnly) {
  let hour = null;
  let note = null;
  let lastSendTime = null;

  function sameDate(a, b) {
    return a && b && a.getFullYear() === b.getFullYear()
      && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  const isSameDay = sameDate(chatDate, targetDate);

  // For dateless messages: which chatDates should map to targetDate?
  let isLeadUpDay = false;
  if (chatDate && targetDate && !isSameDay) {
    const targetDow = targetDate.getDay();
    if (targetDow === 1) {
      // Monday: accept Fri evening, Sat, Sun, Mon morning
      const fri = new Date(targetDate); fri.setDate(fri.getDate() - 3);
      const sat = new Date(targetDate); sat.setDate(sat.getDate() - 2);
      const sun = new Date(targetDate); sun.setDate(sun.getDate() - 1);
      isLeadUpDay = sameDate(chatDate, fri) || sameDate(chatDate, sat) || sameDate(chatDate, sun);
    } else {
      // Weekday: accept previous day
      const prev = new Date(targetDate); prev.setDate(prev.getDate() - 1);
      isLeadUpDay = sameDate(chatDate, prev);
    }
  }

  for (const line of lines) {
    const trimmed = line.trim();

    // Skip reactions (:emoji:), pure numbers, '작성' line
    if (/^:[a-z_+]+:$/.test(trimmed)) continue;
    if (/^\d+$/.test(trimmed)) continue;
    if (trimmed === '작성') continue;
    if (/^\[.+\]$/.test(trimmed)) continue; // [status] line

    // RE: lines - strip prefix and parse the content
    const reStripped = trimmed.startsWith('RE:') ? trimmed.slice(3).trim() : trimmed;

    // Track send time (오전/오후 H:MM)
    const timeMatch = trimmed.match(/^(오전|오후)\s*(\d{1,2}):(\d{2})$/);
    if (timeMatch) {
      let h = parseInt(timeMatch[2]);
      if (timeMatch[1] === '오후' && h !== 12) h += 12;
      if (timeMatch[1] === '오전' && h === 12) h = 0;
      lastSendTime = h;
      continue;
    }

    // Check if line contains explicit date
    const dateMatch = reStripped.match(/(\d{1,2})월\s*(\d{1,2})일/);
    let dateMatches = false;

    if (dateMatch) {
      const msgMonth = parseInt(dateMatch[1]);
      const msgDay = parseInt(dateMatch[2]);
      dateMatches = (msgMonth === targetMonth && msgDay === targetDay);
    } else if (!weekendOnly) {
      // No date in message: use chatDate context
      if (isSameDay) {
        dateMatches = true;
      } else if (isLeadUpDay) {
        if (sameDate(chatDate, targetDate)) {
          dateMatches = lastSendTime !== null && lastSendTime < 10;
        } else {
          dateMatches = true;
        }
      }
    }

    if (!dateMatches) continue;

    // Admin summary (N출 N명) - skip
    if (/\d+출\s*\d+명/.test(reStripped)) continue;

    // 퇴사 joke - skip
    if (/퇴사/.test(reStripped)) continue;

    // Parse hour and note from same line (e.g. "8출 오후반차")
    const hourMatch = reStripped.match(/(\d{1,2})\s*(출근|출)/);
    const noteMatch = reStripped.match(/(연차|병가|공가|오전반차|오후반차|반차)/);

    // Skip if neither found
    if (!hourMatch && !noteMatch) continue;

    // Overwrite with latest match (corrections win)
    if (hourMatch) hour = parseInt(hourMatch[1]);
    if (noteMatch) note = noteMatch[1];
  }

  return hour !== null || note !== null ? { hour, note } : null;
}

function renderResults(hourGroups, specialList, targetDate, isFriday, defaultHour, weekendWork) {
  const resultsEl = document.getElementById('results');
  const contentEl = document.getElementById('resultContent');
  const dateEl = document.getElementById('resultDate');

  const dayNames = ['일','월','화','수','목','금','토'];
  const dayName = dayNames[targetDate.getDay()];
  const m = targetDate.getMonth() + 1;
  const d = targetDate.getDate();
  dateEl.textContent = `${m}월 ${d}일 (${dayName})`;

  let html = '';
  const hours = [8, 9, 10];

  for (const h of hours) {
    const names = hourGroups[h] || [];
    if (names.length === 0) continue;
    html += `<div class="result-group">
      <div class="result-label">${h}시 출근 <span class="count">${names.length}명</span></div>
      <div class="result-names">${names.join(', ')}</div>
    </div>`;
  }

  // Other hours (unlikely but just in case)
  for (const [h, names] of Object.entries(hourGroups)) {
    if (hours.includes(parseInt(h))) continue;
    html += `<div class="result-group">
      <div class="result-label">${h}시 출근 <span class="count">${names.length}명</span></div>
      <div class="result-names">${names.join(', ')}</div>
    </div>`;
  }

  if (specialList.length > 0) {
    const items = specialList.map(s => `${s.name}(${s.note})`).join(', ');
    html += `<div class="result-group">
      <div class="result-label special">특이사항 <span class="count">${specialList.length}명</span></div>
      <div class="result-names">${items}</div>
    </div>`;
  }

  // Weekend work section
  if (weekendWork && Object.keys(weekendWork).length > 0) {
    const dayNames = ['일','월','화','수','목','금','토'];
    for (const [key, data] of Object.entries(weekendWork)) {
      const wd = data.date;
      const wDayName = dayNames[wd.getDay()];
      const entries = Object.entries(data.entries)
        .map(([name, info]) => {
          if (info.note) return `${name}(${info.note})`;
          if (info.hour !== null) return `${name}(${info.hour}시)`;
          return name;
        });
      if (entries.length > 0) {
        html += `<div class="result-group">
          <div class="result-label weekend">주말근무 ${wd.getMonth()+1}월 ${wd.getDate()}일 (${wDayName}) <span class="count">${entries.length}명</span></div>
          <div class="result-names">${entries.join(', ')}</div>
        </div>`;
      }
    }
  }

  if (!html) {
    html = '<div class="no-result">분석 가능한 메시지가 없습니다.</div>';
  }

  contentEl.innerHTML = html;
  resultsEl.classList.add('show');
}

function copyResult() {
  const dateText = document.getElementById('resultDate').textContent;
  const groups = document.querySelectorAll('.result-group');
  let text = dateText + '\n\n';
  groups.forEach(g => {
    const label = g.querySelector('.result-label').textContent.trim();
    const names = g.querySelector('.result-names').textContent.trim();
    text += label + ': ' + names + '\n';
  });
  navigator.clipboard.writeText(text.trim()).then(() => {
    const btn = document.querySelector('#results .btn-small');
    const orig = btn.textContent;
    btn.textContent = '복사됨!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}
</script>

</body>
</html>
